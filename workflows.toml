[meta]
version = "0.8.1"
label_prefix = "com.zacczakk"
log_dir = "logs"
plist_dir = "plists"
state_dir = "state"
default_timeout = 3600

# ── Schedules ──────────────────────────────────────────────────────

[schedules.nightly]
prevent_sleep = true
time = { hour = 1, minute = 0 }
enabled = true
workflows = [
  "skill-sync",
  "vault-embeddings",
  "vault-inbox-processing",
  "vault-session-processing",
  "vault-consolidation",
  "vault-grooming",
  "vault-backlog-triage",
  "vault-retrieval-practice",
  "vault-report-maintenance",
  "vault-knowledge-distillation",
  "vault-embeddings-final",
]

[schedules.sessions-export]
interval = 1800
enabled = true
workflows = ["sessions-export"]

[schedules.log-maintenance]
time = { hour = 0, minute = 55 }
enabled = true
workflows = ["log-maintenance"]

# ── Workflows ──────────────────────────────────────────────────────

[workflows.skill-sync]
type = "script"
script = "scripts/skill-sync.ts"
description = "Sync remote agent skills from upstream repos"
timeout = 300

[workflows.vault-embeddings]
type = "script"
script = "scripts/vault-embeddings.ts"
description = "Re-index Memory vault in QMD for hybrid search"
timeout = 1800

[workflows.vault-embeddings-final]
type = "script"
script = "scripts/vault-embeddings.ts"
description = "Refresh search after successful vault changes"
timeout = 1800
depends_on = ["vault-inbox-processing", "vault-session-processing", "vault-consolidation", "vault-grooming", "vault-backlog-triage", "vault-knowledge-distillation", "vault-retrieval-practice", "vault-report-maintenance"]

[workflows.vault-inbox-processing]
depends_on = ["vault-embeddings"]
type = "agent"
prompt = "prompts/vault-inbox-processing.md"
model = "github-copilot/gpt-6.1-sol#medium"
description = "Process Knowledge vault inbox into enriched backlog notes"
timeout = 3600

[workflows.vault-session-processing]
depends_on = ["vault-embeddings"]
type = "agent"
prompt = "prompts/vault-session-processing.md"
model = "github-copilot/gpt-6.1-sol#medium"
description = "Distill session notes into patterns, tools, and project knowledge"
timeout = 1800

[workflows.vault-grooming]
type = "agent"
prompt = "prompts/vault-grooming.md"
model = "github-copilot/gpt-6.1-sol#high"
outputs = ["~/Vaults/Knowledge/00_system/grooming-reports/{date}.md", "~/Vaults/Memory/system/grooming-reports/{date}.md"]
description = "Sweep both vaults for broken links, orphans, stale notes"
timeout = 5400

[workflows.vault-backlog-triage]
outputs = ["~/Vaults/Knowledge/00_system/backlog-triage-reports/{date}.md", "~/Vaults/Knowledge/00_system/backlog-triage-reports/latest.md"]
type = "agent"
prompt = "prompts/vault-backlog-triage.md"
model = "github-copilot/gpt-6.1-sol#medium"
description = "Evaluate backlog leaves with independent checkpoints; preserve tree indexes"
timeout = 3600

[workflows.vault-knowledge-distillation]
type = "agent"
prompt = "prompts/vault-knowledge-distillation.md"
model = "github-copilot/gpt-6.1-sol#medium"
outputs = ["~/Vaults/Memory/MEMORY.md"]
description = "Distill Memory vault into condensed MEMORY.md"
timeout = 5400

[workflows.vault-consolidation]
depends_on = ["vault-session-processing"]
type = "agent"
prompt = "prompts/vault-consolidation.md"
model = "github-copilot/gpt-6.1-sol#high"
outputs = ["~/Vaults/Memory/system/consolidation-reports/{date}.md"]
description = "Synthesize cross-cutting insights from recent session notes"
timeout = 3600

[workflows.vault-retrieval-practice]
type = "agent"
prompt = "prompts/vault-retrieval-practice.md"
model = "github-copilot/gpt-6.1-sol#high"
outputs = ["~/Vaults/Memory/system/retrieval-reports/{date}.md"]
description = "Spot-check Memory vault notes for accuracy against current reality"
timeout = 1800
cadence_days = 7

[workflows.vault-report-maintenance]
type = "agent"
prompt = "prompts/vault-report-maintenance.md"
model = "github-copilot/gpt-6.1-sol#high"
description = "Keep thirty days of operational reports; preserve findings and clean navigation"
timeout = 900
cadence_days = 7
depends_on = ["skill-sync", "vault-consolidation", "vault-grooming", "vault-backlog-triage", "vault-retrieval-practice"]
outputs = ["~/Vaults/Knowledge/00_system/grooming-reports/report-retention.md", "~/Vaults/Memory/system/report-retention.md"]

[workflows.sessions-export]
type = "script"
script = "scripts/sessions-export.ts"
description = "Incremental export + index of OpenCode and Claude session history"
timeout = 600

[workflows.log-maintenance]
type = "script"
script = "scripts/log-maintenance.ts"
description = "Rotate workflow logs above 10 MiB and retain five archives"
timeout = 300

# ── Services (long-running daemons) ────────────────────────────────

[services.opencode-web]
command = "/opt/homebrew/bin/opencode web"
description = "OpenCode web UI — network-accessible with mDNS + auth"
enabled = false
